{% extends "base.html" %}
{% block title %}Register - E-Learning Platform{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Create Account</h2>
            <p class="text-slate-500 text-sm mt-1">Start learning or teaching today</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                <input type="text" name="name" value="{{ name or '' }}" required
                       class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"
                       placeholder="e.g. John Doe">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" value="{{ email or '' }}" required
                       class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"
                       placeholder="john@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"
                       placeholder="••••••••">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Account Role</label>
                <select name="role" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none bg-white">
                    <option value="student" {% if role == 'student' %}selected{% endif %}>Student (Enroll & Learn)</option>
                    <option value="instructor" {% if role == 'instructor' %}selected{% endif %}>Instructor (Create & Teach Courses)</option>
                </select>
            </div>

            <button type="submit"
                    class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-lg shadow transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center text-sm text-slate-500">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="text-sky-600 font-semibold hover:underline">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
